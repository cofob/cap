name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: cap-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: core
        run: bun install --frozen-lockfile
      - name: Test
        working-directory: core
        run: bun test

  wasm:
    name: cap-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (core)
        working-directory: core
        run: bun install --frozen-lockfile
      - name: Test wasm bindings
        working-directory: wasm
        run: bun test

  widget:
    name: cap-widget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (core)
        working-directory: core
        run: bun install --frozen-lockfile
      - name: Install (widget)
        working-directory: widget
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build widget
        working-directory: widget
        run: bun run build
      - name: Verify generated widget assets
        working-directory: widget
        run: git diff --exit-code -- src/cap.min.js src/cap-floating.min.js
      - name: Install Playwright browsers
        working-directory: widget
        run: bunx playwright install --with-deps chromium
      - name: Run unit tests
        working-directory: widget
        run: bun run test:unit
      - name: Run e2e (basic)
        working-directory: widget
        run: bun test test/e2e.test.js
      - name: Run e2e (instrumentation)
        working-directory: widget
        run: bun test test/e2e-instrumentation.test.js
      - name: Run e2e (regression)
        working-directory: widget
        run: bun test test/e2e-regression.test.js
      - name: Run e2e (worker)
        working-directory: widget
        run: bun test test/e2e-worker.test.js
      - name: Prepare widget release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: widget
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          cp src/LICENSE release/
          cp src/NOTICE release/
          cp src/README.md release/
          cp src/cap-floating.min.js release/
          cp src/cap.compat.min.js release/
          cp src/cap.d.ts release/
          cp src/cap.min.js release/
          cp src/package.json release/
          cp src/wasm-hashes.min.js release/
          npm pack ./src --pack-destination release
          sha256sum release/* > release/SHA256SUMS
      - name: Upload widget release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: widget-release-${{ github.sha }}
          path: widget/release
          if-no-files-found: error
          retention-days: 1

  release-widget:
    name: publish widget release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, wasm, widget, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: widget-release
      cancel-in-progress: false
    steps:
      - name: Download widget release assets
        uses: actions/download-artifact@v4
        with:
          name: widget-release-${{ github.sha }}
          path: release-assets
      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          VERSION=$(node -p "require('./release-assets/package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          TAG="widget-v${VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cap Widget v${RELEASE_VERSION} (${SHORT_SHA})" \
            --generate-notes \
            --latest

  standalone:
    name: cap-standalone
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (core)
        working-directory: core
        run: bun install --frozen-lockfile
      - name: Install (standalone)
        working-directory: standalone
        run: bun install --frozen-lockfile
      - name: Test
        working-directory: standalone
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: bun test
